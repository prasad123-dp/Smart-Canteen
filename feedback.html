<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restora | Feedback & Ratings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="font-sans" data-page="feedback">

    <!-- Feedback Page -->
    <div id="feedbackPage" class="hidden min-h-screen student-bg p-4 md:p-6">
        <div class="w-full max-w-4xl mx-auto">
            <div class="flex items-center gap-4 mb-6">
                <button onclick="closeFeedbackPage()" class="bg-white p-3 rounded-xl shadow-sm hover:bg-orange-50 transition">
                    <i class="fas fa-arrow-left text-orange-600"></i>
                </button>
                <h1 class="text-2xl md:text-3xl font-black text-slate-900">Feedback & Ratings</h1>
            </div>
            <div id="feedbackPageList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </div>
    </div>

    <!-- Feedback & Ratings Modal -->
    <div id="feedbackModal" class="hidden fixed inset-0 z-[80] flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">
        <div class="bg-white p-6 rounded-3xl shadow-xl w-full max-w-md relative">
            <button onclick="closeFeedbackModal()" class="absolute top-4 right-4 text-red-500 hover:text-red-700 transition text-xl">
                <i class="fas fa-times-circle"></i>
            </button>
            <h2 class="text-xl font-bold mb-1 text-center text-black">Rate <span id="feedbackItemName" class="text-orange-600"></span></h2>
            <p class="text-sm text-gray-500 mb-4 text-center">Share your experience</p>

            <input type="hidden" id="feedbackItemId">
            <div id="feedbackStarsInput" class="flex justify-center gap-2 mb-4"></div>
            <textarea id="feedbackComment" rows="3" placeholder="Write your feedback (optional)" class="w-full p-3 border rounded-xl outline-none focus:ring-2 focus:ring-orange-500 text-black mb-4 resize-none"></textarea>

            <button onclick="submitFeedback()" class="w-full bg-orange-600 text-white py-3 rounded-xl font-bold hover:bg-black transition">Submit Feedback</button>

            <div class="mt-5">
                <h3 class="text-sm font-bold text-gray-700 mb-2">Recent Reviews</h3>
                <div id="feedbackListForItem" class="space-y-2 max-h-40 overflow-y-auto"></div>
            </div>
        </div>
    </div>

    <script src="script.js?v=20240613-2" defer></script>
</body>
</html>

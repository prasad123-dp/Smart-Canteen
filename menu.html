<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restora | Menu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="font-sans" data-page="menu">

    <div id="countModal" class="hidden fixed inset-0 z-[70] flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">
        <div class="bg-white p-6 rounded-3xl shadow-xl w-full max-w-xs text-center">
            <h3 id="modalItemName" class="font-bold text-lg mb-2">Item Name</h3>
            <p class="text-sm text-gray-500 mb-4">How many do you want?</p>
            <div class="flex items-center justify-center gap-6 mb-6">
                <button onclick="changeModalCount(-1)" class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center text-xl font-bold text-black">-</button>
                <span id="modalCountValue" class="text-2xl font-black text-black">1</span>
                <button onclick="changeModalCount(1)" class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center text-xl font-bold text-black">+</button>
            </div>
            <button onclick="confirmAddToCart()" class="w-full bg-orange-600 text-white py-3 rounded-xl font-bold">Add to Cart</button>
            <button onclick="closeCountModal()" class="w-full text-gray-400 text-sm mt-3">Cancel</button>
        </div>
    </div>

    <!-- Session Banner -->
    <div id="sessionBanner" class="hidden w-full text-center py-2 px-4 text-xs font-bold"></div>

    <div id="studentDashboard" class="hidden min-h-screen student-bg">
        <nav class="bg-white shadow-sm p-3 md:p-4 flex justify-between items-center px-4 md:px-8 sticky top-0 z-40">
            <div class="flex items-center gap-2 md:gap-4">
                <button onclick="backToRestroSelect()" class="text-gray-400 hover:text-orange-600"><i class="fas fa-chevron-left"></i></button>
                <div class="text-lg md:text-2xl font-bold text-orange-600">Restora <span id="activeRestroName" class="text-gray-400 text-xs md:text-sm font-normal ml-1 md:ml-2"></span></div>
            </div>
            <div class="flex items-center gap-2 md:gap-6">
                <div class="text-gray-700 font-bold text-xs md:text-sm"><i class="fas fa-user mr-1"></i> <span id="displayUserName">User</span></div>
                <button onclick="toggleDarkMode()" class="text-orange-600 px-1 md:px-2"><i class="fas fa-adjust"></i></button>
                <button onclick="logout()" class="text-gray-400 hover:text-red-500"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </nav>
        <main class="p-3 md:p-6 w-full">
            <div class="flex justify-between items-center mb-4 md:mb-6">
                <h2 class="text-xl md:text-2xl font-bold text-gray-800">Menu</h2>
                <button onclick="openCartOrdersPageAsync()" class="bg-orange-600 text-white px-4 py-2 rounded-xl font-bold hover:bg-black transition flex items-center gap-2">
                    <i class="fas fa-shopping-basket"></i>
                    <span>Cart & Orders</span>
                    <span id="cartCountBtn" class="bg-white text-orange-600 text-xs px-2 py-1 rounded-full hidden">0</span>
                </button>
            </div>

            <div class="flex flex-wrap gap-2 mb-4 md:mb-6">
                <button onclick="filterMenu('All')" class="category-filter-btn bg-orange-600 text-white px-3 md:px-4 py-1 rounded-full text-xs md:text-sm whitespace-nowrap">All</button>
                <button onclick="filterMenu('Veg')" class="category-filter-btn bg-white border px-3 md:px-4 py-1 rounded-full text-xs md:text-sm whitespace-nowrap text-black">Veg</button>
                <button onclick="filterMenu('Non-Veg')" class="category-filter-btn bg-white border px-3 md:px-4 py-1 rounded-full text-xs md:text-sm whitespace-nowrap text-black">Non-Veg</button>
                <button onclick="filterMenu('Cakes')" class="category-filter-btn bg-white border px-3 md:px-4 py-1 rounded-full text-xs md:text-sm whitespace-nowrap text-black">Cakes</button>
                <button onclick="filterMenu('Icecreams')" class="category-filter-btn bg-white border px-3 md:px-4 py-1 rounded-full text-xs md:text-sm whitespace-nowrap text-black">Icecreams</button>
                <button onclick="filterMenu('Drinks')" class="category-filter-btn bg-white border px-3 md:px-4 py-1 rounded-full text-xs md:text-sm whitespace-nowrap text-black">Drinks</button>
                <button onclick="filterMenu('Choclates')" class="category-filter-btn bg-white border px-3 md:px-4 py-1 rounded-full text-xs md:text-sm whitespace-nowrap text-black">Choclates</button>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 md:gap-4" id="menuContainer"></div>
        </main>
    </div>

    <!-- Feedback & Ratings Modal -->
    <div id="feedbackModal" class="hidden fixed inset-0 z-[80] flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">
        <div class="bg-white p-6 rounded-3xl shadow-xl w-full max-w-md relative">
            <button onclick="closeFeedbackModal()" class="absolute top-4 right-4 text-red-500 hover:text-red-700 transition text-xl">
                <i class="fas fa-times-circle"></i>
            </button>
            <h2 class="text-xl font-bold mb-1 text-center text-black">Rate <span id="feedbackItemName" class="text-orange-600"></span></h2>
            <p class="text-sm text-gray-500 mb-4 text-center">Share your experience</p>

            <input type="hidden" id="feedbackItemId">
            <div id="feedbackStarsInput" class="flex justify-center gap-2 mb-4"></div>
            <textarea id="feedbackComment" rows="3" placeholder="Write your feedback (optional)" class="w-full p-3 border rounded-xl outline-none focus:ring-2 focus:ring-orange-500 text-black mb-4 resize-none"></textarea>

            <button onclick="submitFeedback()" class="w-full bg-orange-600 text-white py-3 rounded-xl font-bold hover:bg-black transition">Submit Feedback</button>

            <div class="mt-5">
                <h3 class="text-sm font-bold text-gray-700 mb-2">Recent Reviews</h3>
                <div id="feedbackListForItem" class="space-y-2 max-h-40 overflow-y-auto"></div>
            </div>
        </div>
    </div>

    <script src="script.js?v=20240613-2" defer></script>
</body>
</html>
